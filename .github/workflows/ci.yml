name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --workspace
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build --package-path apps/macos
