name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path core/Cargo.toml --all
      - name: Test Rust workspace
        run: cargo test --manifest-path core/Cargo.toml --workspace
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app bundle
        run: ./scripts/package-macos-app.sh "$RUNNER_TEMP/MacPlay.app"
